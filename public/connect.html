<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Your Socials | Video Hero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f1e3d;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 550px;
            width: 100%;
        }
        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
        }
        p {
            color: #a0aec0;
            text-align: center;
            margin-bottom: 32px;
            font-size: 16px;
        }
        #client-connect-widget {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Connect Your Social Accounts</h1>
        <p>Our team will post your content for you through our social media app.</p>
        <div id="client-connect-widget"></div>
    </div>
    
    <script>
        !function(){
            var e=document,t=e.createElement("iframe");
            window.addEventListener("message",function(e){
                if(!e || !e.data || !e.data.height){return;}
                t.height=(parseInt(e.data.height, 10)+45)+"px"
            },!1);
            t.style.border="0";
            t.style.width="100%";
            t.id="client-connect-iframe";
            t.src="https://api.sendible.com/api/v2/client_connect_widget.json?id=2911";
            e.getElementById("client-connect-widget").appendChild(t);
        }();
    </script>
</body>
</html>
